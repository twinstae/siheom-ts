name: Publish

# npm trusted publishing (OIDC): each @siheom/* package on npmjs.com trusts
# twinstae/siheom-ts + publish.yml, so no npm token or OTP is needed.
# Triggered by `yarn release` after the version commit is pushed.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache in the release job (cache poisoning risk).
          package-manager-cache: false

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build

      # Rekor can store a provenance entry and still fail the request; Yarn's
      # retry then gets "409 equivalent entry already exists" and aborts.
      # --tolerate-republish makes re-running skip packages already on npm.
      - name: Publish to npm
        run: |
          for attempt in 1 2 3; do
            if yarn workspaces foreach --all --no-private --topological npm publish --access public --tolerate-republish --provenance; then
              exit 0
            fi
            echo "::warning::Publish attempt ${attempt} failed; retrying"
            sleep 15
          done
          exit 1

nodeLinker: pnp
enableScripts: true

# image-size advisories (GHSA-w3rx-r6r6-pgpr ID 1138808, GHSA-5p2g-fcmc-qvqq ID
# 1138809) have no upstream fix yet (first_patched_version: null); the latest
# 2.0.2 is still affected. Pulled in transitively via metro -> react-native tooling.
npmAuditIgnoreAdvisories:
  - 1138808
  - 1138809

packageExtensions:
  # Portal.mjs imports this package without declaring it (Storybook's web preview).
  "@tamagui/portal@1.144.4":
    dependencies:
      "@tamagui/polyfill-dev": "1.144.4"
  "@testing-library/vue@8.1.0":
    dependencies:
      "@vue/compiler-dom": "3.5.40"
      "@vue/server-renderer": "3.5.40"
  "@vitest/browser@4.1.10":
    dependencies:
      vite: "8.2.0"
  "@vitest/browser-playwright@4.1.10":
    dependencies:
      vite: "8.2.0"
  "vitest@4.1.10":
    dependencies:
      "@opentelemetry/api": "^1.9.0"
  "vitepress@1.6.4":
    dependencies:
      esbuild: "^0.28.1"

# Qwik 1.20 builds successfully with Vite 8 but still declares `vite <8`.
logFilters:
  - code: YN0060
    pattern: "*doesn't satisfy what @builder.io/qwik and other dependencies request*"
    level: discard

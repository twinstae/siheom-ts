nodeLinker: pnp
enableScripts: true

# image-size advisories (GHSA-w3rx-r6r6-pgpr ID 1239766, GHSA-5p2g-fcmc-qvqq ID
# 1239765) are fixed only in 2.0.3+, but metro 0.84 (react-native dev tooling)
# depends on the incompatible image-size ^1.0.2 line, which has no patched release.
npmAuditIgnoreAdvisories:
  - 1239765
  - 1239766

packageExtensions:
  # Portal.mjs imports this package without declaring it (Storybook's web preview).
  "@tamagui/portal@1.144.4":
    dependencies:
      "@tamagui/polyfill-dev": "1.144.4"
  "@testing-library/vue@8.1.0":
    dependencies:
      "@vue/compiler-dom": "3.5.44"
      "@vue/server-renderer": "3.5.44"
  "@vitest/browser@4.1.12":
    dependencies:
      vite: "8.3.5"
  "@vitest/browser-playwright@4.1.12":
    dependencies:
      vite: "8.3.5"
  "vitest@4.1.12":
    dependencies:
      "@opentelemetry/api": "^1.9.0"
  "vitepress@1.6.4":
    dependencies:
      esbuild: "^0.28.1"

# Qwik 1.20 builds successfully with Vite 8 but still declares `vite <8`.
logFilters:
  - code: YN0060
    pattern: "*doesn't satisfy what @builder.io/qwik and other dependencies request*"
    level: discard
